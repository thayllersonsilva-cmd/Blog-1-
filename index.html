<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog</title>
    <style>
        /* Reset e Fontes Importadas */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            line-height: 1.6;
            padding: 40px 20px;
        }

        /* Container Principal */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* Cabeçalho */
        header {
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 40px 24px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        /* Conteúdo */
        main {
            padding: 32px;
        }

        main h2 {
            font-size: 1.5rem;
            color: #1e293b;
            margin-bottom: 12px;
        }

        main p {
            color: #475569;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Título Principal</h1>
            <p>Explicação breve sobre o blog</p>
        </header>
        <main>
            <h2>Subtítulo</h2>
            <p>Escrever detalhadamente sobre o assunto. O uso de uma boa tipografia, espaçamento adequado e sombras suaves torna a leitura muito mais agradável.</p>
        </main>
    </div>
</body>
</html>
